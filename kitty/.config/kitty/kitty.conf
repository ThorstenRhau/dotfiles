# Kitty 0.50
#
# Colors come from Token. dark-theme.auto.conf and light-theme.auto.conf in
# this directory follow the macOS appearance and override all other colors.
# Font: Berkeley Mono Variable (TX-02), SemiCondensed (wdth 90).
# The italic faces are obliques (slnt -16); Berkeley Mono has no true italic.

### Fonts
font_family       family="Berkeley Mono Variable" wdth=90 wght=400 features="+ss04 +ss06"
bold_font         family="Berkeley Mono Variable" wdth=90 wght=700 features="+ss04 +ss06"
italic_font       family="Berkeley Mono Variable" wdth=90 wght=400 slnt=-16 features="+ss04 +ss06"
bold_italic_font  family="Berkeley Mono Variable" wdth=90 wght=700 slnt=-16 features="+ss04 +ss06"
font_size         14
# The default zero is already dotted. ss04 crosses the 7 and ss06 breaks the
# vertical bar so it differs from l and I. ss05 (a wider r) is left off.
# Ligatures are off under the cursor only.
disable_ligatures cursor
# Start of the weight calibration across dark and light themes: tune
# contrast in a dark theme first, then gamma in a light one.
text_composition_strategy 1.0 0
# Icons that Berkeley Mono lacks fall back to Kitty's built-in Nerd symbols.

###                                Cursor
cursor_shape                       block
cursor_beam_thickness              2
cursor_blink_interval              0

###                                Window
remember_window_size               no
initial_window_width               120c
initial_window_height              42c
window_padding_width               4
hide_window_decorations            no
macos_option_as_alt                left
macos_quit_when_last_window_closed yes

###                                Behavior
copy_on_select                     clipboard
mouse_hide_wait                    -1
confirm_os_window_close            0
shell_integration                  enabled
notify_on_cmd_finish               unfocused
update_check_interval              24
enable_audio_bell                  no
