# Kitty 0.50
#
# Colors come from Token. dark-theme.auto.conf and light-theme.auto.conf in
# this directory follow the macOS appearance and override all other colors.
# Font: PragmataPro VF Mono Liga (variable, wght 300 to 700).

### Fonts
font_family       family="PragmataPro VF Mono Liga" wght=450 features="+calt +cv04 +ss13 +ss15 +ss18"
bold_font         family="PragmataPro VF Mono Liga" wght=700 features="+calt +cv04 +ss13 +ss15 +ss18"
italic_font       family="PragmataPro VF Mono Liga" style="Italic" wght=450 features="+calt +cv04 +ss13 +ss15 +ss18 +ss06"
bold_italic_font  family="PragmataPro VF Mono Liga" style="Bold Italic" wght=700 features="+calt +cv04 +ss13 +ss15 +ss18 +ss07"
font_size         15
# Italic uses the script variant ss06, bold italic the bold script variant
# ss07. Both replace the same letters, so enable only one per face.
# Icons that PragmataPro lacks fall back to Symbols Nerd Font Mono, which
# macOS selects automatically.

###                                Cursor
cursor_shape                       block
cursor_beam_thickness              2
cursor_blink_interval              0

###                                Window
remember_window_size               no
initial_window_width               120c
initial_window_height              42c
window_padding_width               4
hide_window_decorations            no
macos_option_as_alt                left
macos_quit_when_last_window_closed yes

###                                Behavior
copy_on_select                     clipboard
mouse_hide_wait                    -1
confirm_os_window_close            0
shell_integration                  enabled
notify_on_cmd_finish               unfocused
update_check_interval              24
enable_audio_bell                  no
