# Kitty 0.50
#
# Colors come from Token. dark-theme.auto.conf and light-theme.auto.conf in
# this directory follow the macOS appearance and override all other colors.
# MonoLisa weights and OpenType features mirror the Ghostty configuration.
# See ghostty/.config/ghostty/config.ghostty for the feature legend.

### Fonts
font_family       family="MonoLisaCode" wght=450 features="+calt +cv01 +cv02 +cv03 +cv04 +cv05 +cv06 -cv07 -cv08 +cv09 +cv10 +cv11 +cv12 +dlig +liga -ss01 -ss02 -ss03 -ss04 -ss05 -ss06 -ss07 -ss08 -ss09 -ss10 -ss11 -ss12 +ss13 -ss14 -ss15 -zero"
bold_font         family="MonoLisaCode" wght=700 features="+calt +cv01 +cv02 +cv03 +cv04 +cv05 +cv06 -cv07 -cv08 +cv09 +cv10 +cv11 +cv12 +dlig +liga -ss01 -ss02 -ss03 -ss04 -ss05 -ss06 -ss07 -ss08 -ss09 -ss10 -ss11 -ss12 +ss13 -ss14 -ss15 -zero"
italic_font       family="MonoLisaCode" style="Italic" wght=450 features="+calt +cv01 +cv02 +cv03 +cv04 +cv05 +cv06 -cv07 -cv08 +cv09 +cv10 +cv11 +cv12 +dlig +liga -ss01 -ss02 -ss03 -ss04 -ss05 -ss06 -ss07 -ss08 -ss09 -ss10 -ss11 -ss12 +ss13 -ss14 -ss15 -zero"
bold_italic_font  family="MonoLisaCode" style="Bold Italic" wght=700 features="+calt +cv01 +cv02 +cv03 +cv04 +cv05 +cv06 -cv07 -cv08 +cv09 +cv10 +cv11 +cv12 +dlig +liga -ss01 -ss02 -ss03 -ss04 -ss05 -ss06 -ss07 -ss08 -ss09 -ss10 -ss11 -ss12 +ss13 -ss14 -ss15 -zero"
font_size         13
# Mirrors Ghostty's appearance grade (GRAD -15 dark, +15 light) relative to
# the macOS default of 1.7 30: the higher gamma thickens dark text on light
# backgrounds and the lower contrast thins light text on dark backgrounds.
text_composition_strategy 2.0 15
# Icons that MonoLisaCode lacks fall back to Symbols Nerd Font Mono, which
# macOS selects automatically.

###                                Cursor
cursor_shape                       block
cursor_beam_thickness              2
cursor_blink_interval              0

### Tab Bar
tab_bar_edge top
tab_bar_style fade

###                                Window
remember_window_size               no
initial_window_width               120c
initial_window_height              42c
window_padding_width               4
hide_window_decorations            no
macos_option_as_alt                left
macos_quit_when_last_window_closed yes

###                                Behavior
copy_on_select                     clipboard
mouse_hide_wait                    -1
confirm_os_window_close            0
shell_integration                  enabled
notify_on_cmd_finish               unfocused
update_check_interval              24
enable_audio_bell                  no
