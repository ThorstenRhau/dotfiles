"$schema" = "https://starship.rs/config-schema.json"

add_newline         = true
command_timeout     = 1000
continuation_prompt = "[.](bright-black) "
format              = "$username$hostname$directory$git_branch$git_commit$git_state$git_status$package$golang$lua$nodejs$python$claude_cost$claude_model$line_break$jobs$battery$status$character"
right_format        = "$cmd_duration"

[cmd_duration]
format = "[$duration]($style)"

[character]
error_symbol              = "[▶](bold red)"
success_symbol            = "[▶](bold green)"
vimcmd_replace_one_symbol = "[◀](bold purple)"
vimcmd_replace_symbol     = "[◀](bold purple)"
vimcmd_symbol             = "[◀](bold green)"
vimcmd_visual_symbol      = "[◀](bold yellow)"

[claude_cost]
format = ' [·](bright-black) [$symbol(\$$cost)]($style)'
symbol = "cost "

[claude_model]
format = " [·](bright-black) [$symbol$model]($style)"
symbol = "claude "

[hostname]
format   = "[ssh@$hostname](bold yellow) [·](bright-black) "
ssh_only = true

[username]
detect_env_vars = ["SSH_CLIENT", "SSH_CONNECTION", "SSH_TTY", "SUDO_USER"]
format          = "[$user]($style) [·](bright-black) "
show_always     = false
style_root      = "red bold"
style_user      = "green bold"

[directory]
format    = "[$path]($style)[$read_only]($read_only_style)"
read_only = " 󰌾"

[git_branch]
format            = " [·](bright-black) [$symbol$branch]($style)"
symbol            = " "
truncation_symbol = "..."

[git_commit]
format       = " [·](bright-black) [$hash$tag]($style)"
tag_disabled = false
tag_symbol   = "  "

[git_state]
format = " [·](bright-black) [$state( $progress_current/$progress_total)]($style)"

[git_status]
ahead             = " [↑${count}](green)"
behind            = " [↓${count}](red)"
conflicted        = " [=${count}](red bold)"
deleted           = " [x${count}](red)"
diverged          = " [↕↑${ahead_count}↓${behind_count}](yellow)"
format            = "($all_status$ahead_behind)"
ignore_submodules = true
modified          = " [!${count}](yellow)"
renamed           = " [r${count}](purple)"
staged            = " [+${count}](green)"
stashed           = " [\\$${count}](bright-black)"
style             = "red"
untracked         = " [?${count}](blue)"

[package]
format = " [·](bright-black) [$symbol$version]($style)"
symbol = "󰏗 "
style  = "bold purple"

[golang]
format = " [·](bright-black) [$symbol$version]($style)"
symbol = " "

[lua]
format = " [·](bright-black) [$symbol$version]($style)"
symbol = " "

[nodejs]
format = " [·](bright-black) [$symbol$version]($style)"
symbol = " "

[python]
detect_extensions = []
detect_folders    = []
format            = " [·](bright-black) [$symbol$version]($style)( [$virtualenv]($style))"
symbol            = " "

[jobs]
symbol = "*"

[battery]
charging_symbol    = "󰂄 "
discharging_symbol = "󰂃 "
empty_symbol       = "󰂎 "
full_symbol        = "󰁹 "
unknown_symbol     = "󰂑 "

[status]
disabled              = false
format                = "[$symbol$status]($style) "
map_symbol            = true
not_executable_symbol = "x!"
not_found_symbol      = "x?"
sigint_symbol         = "^C"
signal_symbol         = "sig"
symbol                = "x"
