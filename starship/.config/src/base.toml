"$schema" = "https://starship.rs/config-schema.json"

add_newline     = true
command_timeout = 1000
right_format    = "$cmd_duration"

[character]
error_symbol   = "[❯❯](bold red)"
success_symbol = "[❯❯](bold green)"

[hostname]
format     = "[$ssh_symbol $hostname ](bold yellow)"
ssh_only   = true
ssh_symbol = "⇄"

[username]
detect_env_vars = ["SSH_CLIENT", "SSH_CONNECTION", "SSH_TTY", "SUDO_USER"]
format          = "[$user]($style) "
show_always     = false
style_root      = "red bold"
style_user      = "green bold"

[git_branch]
symbol = " "

[cmd_duration]
format = "took [$duration]($style)"

[git_commit]
tag_disabled = false
tag_symbol   = '  '

[git_status]
ahead             = "[ ](green)"
behind            = "[ ](red)"
conflicted        = "[ ](red bold)"
deleted           = "[ ](red)"
disabled          = false
diverged          = "[ ](yellow)"
format            = "($all_status$ahead_behind )"
ignore_submodules = true
modified          = "[ ](yellow)"
renamed           = "[ ](purple)"
staged            = "[ ](green)"
stashed           = "[ ](dimmed)"
style             = "red"
untracked         = "[ ](blue)"

[git_metrics]
added_style   = "green"
deleted_style = "red"
disabled      = false
format        = "([ $added]($added_style) )([ $deleted]($deleted_style) )"

