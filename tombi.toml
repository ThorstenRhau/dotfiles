[format.rules]
comment-style                   = "normalize"
key-value-equals-sign-alignment = true
trailing-comment-alignment      = true

[lint.rules]
key-empty = "warn"

[[overrides]]
files.include = ["herdr/.config/herdr/themes/*.toml"]

# Preserve canonical formatting in Token's imported generated fragments.
[overrides.format]
enabled = false
