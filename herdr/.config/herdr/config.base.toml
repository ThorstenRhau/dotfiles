# Non-theme Herdr preferences. The active config.toml is generated by Zsh.

onboarding = false

[keys]
prefix           = "ctrl+b"
new_worktree     = ""
focus_pane_left  = ["prefix+h", "alt+left"]
focus_pane_down  = ["prefix+j", "alt+down"]
focus_pane_up    = ["prefix+k", "alt+up"]
focus_pane_right = ["prefix+l", "alt+right"]

[ui]
sidebar_start_collapsed      = false
sidebar_collapsed_mode       = "compact"
mouse_capture                = true
copy_on_select               = true
prompt_new_tab_name          = false
prompt_new_workspace_name    = false
pane_borders                 = "auto"
pane_outer_borders           = false
pane_scrollbars              = false
pane_gaps                    = false
hide_tab_bar_when_single_tab = true
tab_bar_position             = "bottom"
agent_panel_sort             = "priority"
status_indicators            = "symbols"

[ui.sidebar.agents]
row_gap = 0

[ui.sidebar.spaces]
row_gap = 0

[ui.toast]
delivery      = "terminal"
delay_seconds = 1

[ui.sound]
enabled = false

[experimental]
# Pane output can contain credentials and other sensitive data.
pane_history = false
