notARepository: "quit"
promptToReturnFromSubprocess: false
gui:
  nerdFontsVersion: "3"
  timeFormat: "2006-01-02 15:04:05 MST"
git:
  # Cycle renderers with |.
  diffRenderers:
    # Git config turns delta's side-by-side on; the CLI flag switches it off
    # when the diff view is too narrow for two columns.
    - name: delta
      command: >-
        delta --paging=never {{if lt .width 160}}--side-by-side=false{{end}}
    - name: difftastic
      type: extDiff
      command: >-
        difft --color=always --background={{colorScheme}}
        --context={{diffContext}}
